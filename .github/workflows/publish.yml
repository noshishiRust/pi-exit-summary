# Publishes the package to npm when a version tag (v*.*.*) is pushed.
# Uses npm trusted publishing (OIDC): no long-lived token. The trusted
# publisher must be configured on npmjs.com for this repository
# (noshishiRust/pi-exit-summary, workflow publish.yml, npm publish
# allowed); without it the publish step fails with ENEEDAUTH.
name: Publish

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm and Node
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@24
          cache: true
          install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --no-trust-lockfile
      - name: Typecheck
        run: pnpm check
      - name: Test
        run: pnpm test
      # pnpm 12 authenticates via the workflow's OIDC token when
      # id-token: write is granted; no NODE_AUTH_TOKEN is needed.
      - name: Publish to npm
        run: pnpm publish --access public --no-git-checks
